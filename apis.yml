name: Aizome
description: 'Aizome is an enterprise AI agent security and governance platform that makes autonomous
  AI agents accountable through identity-led access control and intent validation. Its platform follows
  a three-step model: Discover (map every AI agent in the enterprise, including undocumented ones), Assess
  Risk (score agents by data access, functionality, and behavior), and Control and Govern (enforce policy
  through identity-led governance and intent interception before execution). Aizome inherits agent identity
  from users scoped to specific tasks and integrates with existing enterprise identity systems such as
  Okta, Microsoft Entra, and SailPoint rather than replacing them. It targets enterprise workflow automation
  use cases including billing, talent reviews, contract monitoring, and customer service. Aizome is backed
  by Norwest Venture Partners. No public API, developer portal, or OpenAPI specification is published at
  this time.'
